<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>鳩メーカー（試作） | ysmrastro toolbox</title>
  <meta name="description" content="体の大きさ・羽毛のふくらみ・頭・首・脚の長さを変えて、好きな鳩を作れます。">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ysmrastro toolbox">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:url" content="https://ysmrastro.github.io/toolbox/pigeon-maker/">
  <meta property="og:title" content="鳩メーカー（試作）">
  <meta property="og:description" content="体の大きさ・胴まわり・脚の長さ・首・頭を変えて、好きなドバトを作る。翼長・跗蹠・体重は論文の実測の範囲で動きます。">
  <meta property="og:image" content="https://ysmrastro.github.io/toolbox/pigeon-maker/ogp.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="鳩メーカー（試作）">
  <meta name="twitter:description" content="体の大きさ・胴まわり・脚の長さ・首・頭を変えて、好きなドバトを作る。">
  <meta name="twitter:image" content="https://ysmrastro.github.io/toolbox/pigeon-maker/ogp.png">
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="stylesheet" href="../shared/css/variables.css">
  <link rel="stylesheet" href="../shared/css/reset.css">
  <link rel="stylesheet" href="../shared/css/components.css">
  <link rel="stylesheet" href="../shared/css/layout.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="tb-header">
  <a href="../" class="tb-header__logo">ysmrastro toolbox</a>
  <nav class="tb-header__nav"><a href="../">ツール一覧</a></nav>
</header>

<main class="pm">
  <h1 class="pm__title">鳩メーカー <small>試作</small></h1>

  <section class="pm__view">
    <div class="pm__info" id="info"></div>
    <div class="pm__stage" id="stage"></div>
    <div class="pm__poses" id="poses" role="radiogroup" aria-label="ポーズ"></div>
  </section>

  <section class="pm__panel" aria-label="調整">
    <div class="pm__btns">
      <button class="tb-btn tb-btn--secondary" id="omakase">おまかせ個体</button>
      <button class="tb-btn tb-btn--secondary" id="reset">はじめに戻す</button>
      <button class="tb-btn tb-btn--secondary" id="copy">設定をコピー</button>
      <button class="tb-btn tb-btn--secondary" id="load">設定を読み込む</button>
    </div>
    <div class="pm__seed">
      <label for="seed">個体番号</label>
      <input id="seed" type="number" min="1" max="9999" inputmode="numeric">
      <button class="tb-btn tb-btn--secondary" id="seedgo">この番号で作る</button>
    </div>
    <div class="pm__sec">羽色</div>
    <div class="pm__morphs" id="morphs" role="radiogroup" aria-label="羽色"></div>
    <div id="sliders"></div>
    <div class="pm__btns">
      <button class="tb-btn tb-btn--primary" id="save">画像で保存</button>
    </div>
  </section>
</main>
<script src="pigeon.js"></script>
<script src="app.js"></script>
</body>
</html>
