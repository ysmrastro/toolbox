# 流星撮影セッティングのテスト。このツールと、それが使うもの（共通CSS・開発用の
# package.json）が変わった PR でだけ走る。
#
# 【なぜ2つのジョブに分けるか】
# Small テストは依存パッケージが要らず数秒で終わる。E2E は Playwright の
# ブラウザ（約100MB）を落とすぶん遅い。分けておけば、落ちたときにどちらの層の
# 問題かがチェック一覧を見ただけで分かる。
#
# 【TZ を固定する理由】
# 日本の空を計算するアプリで、テストの参照値も国立天文台の JST の公表値。
# CI の既定（UTC）のままだと「その夜」の数え方が実際とずれる。
name: CI - meteor-settings

on:
  pull_request:
    branches:
      - main
    # synchronize を含める: PR に追加コミットを積んだときも再実行する
    types: [opened, reopened, synchronize]
    paths:
      - 'meteor-settings/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci-meteor-settings.yml'

# 同じブランチに続けて push したら、走っている古いほうは止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

jobs:
  unit:
    name: Small テスト
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # 依存パッケージなしで動く（Node 標準の node:test）ので npm ci は要らない
      - name: npm run test:meteor-settings
        run: npm run test:meteor-settings

  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: 依存パッケージを入れる
        run: npm ci

      # ブラウザ本体は node_modules と別の場所に入るので、自前でキャッシュする。
      # キーは package-lock.json（＝Playwright の版）に紐付ける
      - name: Playwright のブラウザをキャッシュから復元
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Playwright のブラウザを入れる
        run: npx playwright install --with-deps chromium

      - name: npm run test:e2e
        run: npm run test:e2e
