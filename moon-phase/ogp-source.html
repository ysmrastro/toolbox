<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>OGP source — 月の満ち欠けシミュレーター</title>
<!-- 1200x630 で撮って ogp.png として保存する。実物の描画をそのまま使う。 -->
<link rel="stylesheet" href="../shared/css/variables.css">
<link rel="stylesheet" href="../shared/css/reset.css">
<link rel="stylesheet" href="style.css">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:var(--mp-bg)}
  .ogp{display:grid;grid-template-columns:640px 1fr;height:630px;align-items:center}
  .ogp__art{display:flex;align-items:center;justify-content:center;gap:24px;padding:0 0 0 40px}
  .ogp__art .mp-panel{padding:14px;margin:0}
  .ogp__art .mp-panel svg{width:260px;height:260px;max-width:none;max-height:none}
  .ogp__art .mp-panel h2,.ogp__art .mp-hint{display:none}  /* OGP では見出し・説明は要らない */
  .ogp__text{padding:0 56px 0 40px}
  .ogp__eyebrow{font-family:var(--tb-font-mono);font-size:18px;letter-spacing:.22em;color:var(--mp-primary);margin:0 0 18px}
  .ogp__title{font-size:50px;line-height:1.3;font-weight:700;color:var(--mp-primary);margin:0 0 22px;letter-spacing:.01em}
  .ogp__lead{font-size:22px;line-height:1.8;color:var(--mp-text);margin:0}
  .ogp__lead b{color:var(--mp-gold)}
  .hidden-host{position:absolute;left:-9999px;top:0;width:10px}
</style>
</head>
<body>
  <div class="ogp">
    <div class="ogp__art">
      <section class="mp-panel mp-panel--orbit"><svg id="mp-orbit" viewBox="0 0 380 294"></svg></section>
      <section class="mp-panel mp-panel--shape">
        <svg id="mp-shape" viewBox="0 0 232 232"></svg>
        <div class="mp-moon-overlay"><p>いまは しずんでいて 見えない</p></div>
      </section>
    </div>
    <div class="ogp__text">
      <p class="ogp__eyebrow">YSMRASTRO TOOLBOX</p>
      <h1 class="ogp__title">月の満ち欠け<br>シミュレーター</h1>
      <p class="ogp__lead">実際のこよみで、<br><b>地球から見た月の形</b>がその場で変わる。<br>福岡から見た空も分かります。</p>
    </div>
  </div>

  <!-- app.js が探す要素。ここは撮影範囲の外に置く -->
  <div class="hidden-host">
    <p id="mp-age-value"></p>
    <p id="mp-name"></p>
    <p id="mp-daynight"></p>
    <p id="mp-moonvis"></p>
    <input type="range" id="mp-day-slider" min="0" max="29" step="1" value="0">
    <input type="range" id="mp-time-slider" min="6" max="29.75" step="0.25" value="12">
    <output id="mp-day-out"></output>
    <output id="mp-time-out"></output>
    <button id="mp-day-prev"></button>
    <button id="mp-day-next"></button>
    <button id="mp-time-prev"></button>
    <button id="mp-time-next"></button>
    <div>
      <button class="mp-speed-btn" data-speed="1"></button>
      <button class="mp-speed-btn is-active" data-speed="6"></button>
      <button class="mp-speed-btn" data-speed="24"></button>
      <button class="mp-speed-btn" data-speed="72"></button>
    </div>
    <button id="mp-play"></button>
    <!-- 地平線ビューは絵柄に入れない（横長で1200x630に収まりにくいため）が、
         app.js が要素を探すので置いてはおく -->
    <div class="mp-hz-wrap"><svg id="mp-horizon" viewBox="0 0 640 320"></svg></div>
    <p id="mp-events"></p>
  </div>

  <script src="../meteor-settings/astro.js"></script>
  <script src="app.js"></script>
  <script>
    // 絵柄は日7・18時（夕方の上弦）にする
    document.getElementById('mp-day-slider').value = 7;
    document.getElementById('mp-day-slider').dispatchEvent(new Event('input', { bubbles: true }));
    document.getElementById('mp-time-slider').value = 18;
    document.getElementById('mp-time-slider').dispatchEvent(new Event('input', { bubbles: true }));
  </script>
</body>
</html>
