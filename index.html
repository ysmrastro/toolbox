<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ysmrastro toolbox</title>
  <meta name="description" content="ちょっとしたWebアプリツール集。ブラウザだけで動く、天体写真まわりの道具を置いています。">

  <!-- SNS でリンクを共有したときのカード表示（og:image は絶対URLでないと反映されない） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ysmrastro toolbox">
  <meta property="og:locale" content="ja_JP">
  <meta property="og:url" content="https://ysmrastro.github.io/toolbox/">
  <meta property="og:title" content="ysmrastro toolbox">
  <meta property="og:description" content="ちょっとしたWebアプリツール集。ブラウザだけで動く、天体写真まわりの道具を置いています。">
  <meta property="og:image" content="https://ysmrastro.github.io/toolbox/ogp.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ysmrastro toolbox">
  <meta name="twitter:description" content="ちょっとしたWebアプリツール集。ブラウザだけで動く、天体写真まわりの道具を置いています。">
  <meta name="twitter:image" content="https://ysmrastro.github.io/toolbox/ogp.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <link rel="stylesheet" href="shared/css/variables.css">
  <link rel="stylesheet" href="shared/css/reset.css">
  <link rel="stylesheet" href="shared/css/components.css">
  <link rel="stylesheet" href="shared/css/layout.css">
  <style>
    .hero {
      text-align: center;
      padding: var(--tb-space-2xl) 0;
    }

    .hero__title {
      font-size: var(--tb-font-size-2xl);
      color: var(--tb-accent);
      margin-bottom: var(--tb-space-sm);
    }

    .hero__subtitle {
      font-size: var(--tb-font-size-base);
      color: var(--tb-text-secondary);
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--tb-space-lg);
      margin-top: var(--tb-space-xl);
    }

    .tool-card {
      display: block;
      background: var(--tb-bg-secondary);
      border: 1px solid var(--tb-border);
      border-radius: var(--tb-radius-xl);
      padding: var(--tb-space-xl);
      transition: border-color var(--tb-transition), transform var(--tb-transition);
    }

    .tool-card:hover {
      border-color: var(--tb-accent);
      transform: translateY(-2px);
      color: inherit;
    }

    .tool-card__icon {
      font-size: 2rem;
      margin-bottom: var(--tb-space-md);
    }

    .tool-card__title {
      font-size: var(--tb-font-size-lg);
      font-weight: 700;
      color: var(--tb-text-primary);
      margin-bottom: var(--tb-space-sm);
    }

    .tool-card__desc {
      font-size: var(--tb-font-size-sm);
      color: var(--tb-text-secondary);
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <header class="tb-header">
    <a href="./" class="tb-header__logo">ysmrastro toolbox</a>
    <nav class="tb-header__nav">
      <a href="https://ysmrastro.github.io/numanohotori/" target="_blank">numanohotori</a>
    </nav>
  </header>

  <div class="tb-container">
    <section class="hero">
      <h1 class="hero__title">toolbox</h1>
      <p class="hero__subtitle">ちょっとしたWebアプリツール集</p>
    </section>

    <section class="tools-grid">
      <a href="qr-generator/" class="tool-card">
        <div class="tool-card__icon">QR</div>
        <h2 class="tool-card__title">QRコード生成ツール</h2>
        <p class="tool-card__desc">カスタマイズ可能なQRコード生成。プリセットテーマ・ロゴ対応、リアルタイムプレビュー。PNG/SVG/JPEG でダウンロード。</p>
      </a>
      <a href="meteor-settings/" class="tool-card">
        <div class="tool-card__icon">☄️</div>
        <h2 class="tool-card__title">流星撮影セッティング</h2>
        <p class="tool-card__desc">機材構成と流星群・撮影目的から、露出・F値・ISO を理論で算出。到達等級と火球の白飛び限界も表示。ホーム画面に追加すればオフラインでも動きます。</p>
      </a>
    </section>
  </div>
</body>
</html>
